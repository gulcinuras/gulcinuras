# .github/workflows/metrics.yml
# Generates github-metrics.svg on a schedule and commits it back to this repo.
#
# Setup:
#   1. Create a classic personal access token with the `repo` scope
#      (add `read:org` if you want organisation contributions counted).
#   2. Add it to this repository as a secret named METRICS_TOKEN.
#   3. Settings > Actions > General > Workflow permissions: allow read and write.
#   4. Run the workflow once manually to generate the first SVG.

name: Metrics

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly, Sunday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gulcinuras
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Madrid

          # Panels
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member

          # Language breakdown, weighted by lines actually written
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

          # Where the commits actually went
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: issue, pr, release, push

          # Public packages you maintain
          plugin_projects: no
          plugin_followup: no
          plugin_lines: yes
          plugin_lines_sections: base
