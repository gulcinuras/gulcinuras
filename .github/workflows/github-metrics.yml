# .github/workflows/metrics.yml
# Renders github-metrics.svg and commits it back to this repo.
#
# Setup:
#   1. Classic personal access token with `repo` scope (add `read:org` for
#      organisation contributions), stored as the secret METRICS_TOKEN.
#   2. Settings > Actions > General > Workflow permissions: read and write.
#   3. Actions tab > Metrics > Run workflow.

name: Metrics

on:
  schedule:
    - cron: "0 6 * * 0"   # weekly, Sunday 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gulcinuras
          filename: github-metrics.svg
          template: classic
          config_timezone: Europe/Madrid

          # No base panels. The default header carries follower counts, and the
          # community/repositories panels render stars, forks, packages and
          # sponsors — all zero on a personal account whose work lives in org
          # repos. Empty counters read worse than no counters.
          base: ""

          # Notable contributions: which repositories the commits actually
          # went to. `repositories: yes` prints repo names rather than just
          # the organisation; `indepth: yes` adds a per-repo commit count with
          # a gauge showing your share of the total.
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
          plugin_notable_from: all
          plugin_notable_types: commit, pull_request
          plugin_notable_self: yes

          # Language split, measured by lines written rather than repo count.
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_sections: most-used

          # Match commits authored under a different git identity, otherwise
          # indepth analysis silently attributes none of them to you.
          commits_authoring: gulcinuras, gulcin_uras@hotmail.com, Gülçin Uras
